<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Child Registration</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eaf6ff;
        }

        /* Sidebar */

        .sidebar {
            width: 230px;
            height: 100vh;
            background-color: #1976d2;
            padding: 20px;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
        }

        .sidebar h2 {
            color: white;
            font-size: 20px;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 10px;
            margin-bottom: 8px;
            border-radius: 5px;
        }

        .sidebar a:hover {
            background-color: #125ca1;
        }

        /* Main Content */

        .main-content {
            margin-left: 230px;
            padding: 30px;
        }

        h1 {
            color: #1976d2;
        }

        /* Registration Form */

        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #b0c4de;
            max-width: 650px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #444;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #125ca1;
        }

        #message {
            color: green;
            margin-top: 15px;
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 160px;
            }

            .main-content {
                margin-left: 160px;
                padding: 15px;
            }
        }

    </style>

</head>

<body>

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>Child Vaccination</h2>

        <a href="dashboard.html">Dashboard</a>

        <a href="child.html">Child Registration</a>

        <a href="schedule.html">Vaccination Schedule</a>

        <a href="records.html">Vaccination Records</a>

        <a href="reminders.html">Notifications</a>

        <a href="ind.html">Logout</a>

    </div>


    <!-- Main Content -->

    <div class="main-content">

        <h1>Child Registration</h1>

        <p>Enter the child's details below.</p>

        <div class="form-container">

            <form id="childForm" action="register_child.php" method="POST">

                      
<form id="childform" action="register_child.php" method="POST">

    <h2>Parent Details</h2>

    <label>Parent Name</label>
    <input type="text"id="parentName" name="parent_name" required>

    <label>Phone</label>
    <input type="tel"id="phone" name="phone" required>

    <label>Email</label>
    <input type="email"id="email" name="email" required>

    <label>Parent Address</label>
    <input type="text"id="address" name="parent_address" required>

    <h2>Child Details</h2>

    <label>Child Name</label>
    <input type="text"id="childName" name="child_name" required>

    <label>Date of Birth</label>
    <input type="date" id="dob"name="date_of_birth" required>

    <label>Gender</label>
    <select id="gender" name="gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
    </select>

    <label>Blood Group</label>
    <input type="text"id="blood_group" name="blood_group">

    <label>Child Address</label>
    <input type="text"id="child_address" name="child_address">

    <button type="submit">Register Child</button>

</form>


            </form>

        </div>

    </div>


   





</body>

</html>
